name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64.exe
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libudev-dev libdbus-1-dev pkg-config libssl-dev build-essential

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Datum v__VERSION__
          releaseBody: |
            Datum desktop installers. Pick the file for your OS from the assets below.

            - **Windows:** `.msi` or `-setup.exe`
            - **macOS:** `.dmg` (aarch64 = Apple Silicon, x64 = Intel)
            - **Linux:** `.AppImage`, `.deb` or `.rpm`
            - `mavlink_monitor-*`: standalone command-line MAVLink monitor
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload mavlink_monitor CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri
          cargo build --release --locked --bin mavlink_monitor --target ${{ matrix.target }}
          version=$(node -p "require('./tauri.conf.json').version")
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/mavlink_monitor${ext}" "mavlink_monitor-${{ matrix.suffix }}"
          gh release upload "v${version}" "mavlink_monitor-${{ matrix.suffix }}" --clobber
